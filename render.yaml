# Render Blueprint: one web service (site + API) and one Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: hustla
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install -g pnpm@10 && CI=true pnpm install --no-frozen-lockfile && PORT=3000 BASE_PATH=/ pnpm --filter ./artifacts/hustla-site-preview run build && node_modules/.bin/esbuild server/render.mts --bundle --platform=node --format=esm --target=node20 --outfile=server-dist/server.mjs --external:pg-native --external:@netlify/database "--banner:js=import{createRequire as __cr}from'module';const require=__cr(import.meta.url);"
    startCommand: node server-dist/server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: hustla-db
          property: connectionString
      - key: ADMIN_EMAILS
        value: lanoelliot@gmail.com
      - key: ADMIN_SETUP_CODE
        sync: false

databases:
  - name: hustla-db
    plan: free
    region: frankfurt
